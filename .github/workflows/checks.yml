name: PR checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      # Thresholds in lighthouserc.json only warn for now.
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.15.1 autorun
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci
          if-no-files-found: ignore

      # Fails the job on any axe violation.
      - run: npx playwright install --with-deps chromium
      - name: axe accessibility check
        run: npm run test:a11y
